name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@master
        with:
          github_user_name: Gabyzoca
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: profile/stats.svg
          theme: tokyonight

      - name: Generate Top Languages
        uses: anuraghazra/github-readme-stats@master
        with:
          github_user_name: Gabyzoca
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: profile/top-langs.svg
          layout: compact
          theme: tokyonight
